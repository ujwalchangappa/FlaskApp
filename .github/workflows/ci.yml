name: Flask CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/ujwal_Flask_App
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pip install pytest-cov
          pytest --cov=app --cov-report=xml --cov-report=term

      - name: Run SonarQube Analysis with Docker
        run: |
          docker run --rm \
            -e SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }} \
            -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
            -v $(pwd):/usr/src \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=/usr/src/app \
            -Dsonar.tests=/usr/src/tests \
            -Dsonar.python.coverage.reportPaths=/usr/src/coverage.xml \
            -Dsonar.qualitygate.wait=true

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hello-flask:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/hello-flask:${GITHUB_SHA:0:7} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ujwal_Flask_App')
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ujwal_Flask_App')
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-flask:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-flask:${GITHUB_SHA:0:7}
