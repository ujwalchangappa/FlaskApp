name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/ujwal_Flask_App

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hello-flask:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/hello-flask:${GITHUB_SHA:0:7} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ujwal_Flask_App')
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ujwal_Flask_App')
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-flask:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-flask:${GITHUB_SHA:0:7}
